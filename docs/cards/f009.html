          <p>八十年代乡村的清晨，阳光把影子拉得长长的。系着红领巾的小男孩站在自家门前，怀里紧紧抱着课本，帆布书包挎在肩头，手里提着印着小花的搪瓷水壶。

今天是他期盼已久的日子，我终于来上学啦！土坯院墙、老旧木门，墙边停着家里的黑色二八大杠自行车。小小的心里满是憧憬，马上就能坐在教室里读书、认识新朋友。</p>
